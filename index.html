<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ReasoningBank Demo – a browser-based AI travel planner that learns from past trips using structured memory. Unofficial demo implementation." />
    <title>ReasoningBank Demo – AI Travel Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <!-- coi-serviceworker: injects COOP/COEP headers so WebGPU/SharedArrayBuffer works on GitHub Pages -->
  <script>
    if (typeof SharedArrayBuffer === "undefined") {
      const sw = navigator.serviceWorker;
      if (sw) {
        sw.register("./coi-serviceworker.js").then(() => {
          if (!sw.controller) window.location.reload();
        });
      }
    }
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
